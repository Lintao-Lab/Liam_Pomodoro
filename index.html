<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';">
<title>Pomodoro</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2238%22 fill=%22%23141414%22/></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --paper: #f2eee2;
    --card: #f8f5ec;
    --ink: #141414;
    --ink-dim: rgba(20, 20, 20, 0.52);
    --ink-faint: rgba(20, 20, 20, 0.34);
    --hairline: rgba(20, 20, 20, 0.16);
    --track: rgba(20, 20, 20, 0.10);
    --serif: Baskerville, "Baskerville Old Face", "Hoefler Text", Garamond, "Times New Roman", serif;
    --numeral: Didot, "Bodoni 72", Baskerville, "Times New Roman", serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--serif);
    background: var(--paper);
    color: var(--ink);
  }

  /* ---- Card: double-ruled frame, like a printed plate ---- */
  .card {
    position: relative;
    width: min(400px, 92vw);
    padding: 40px 36px 32px;
    background: var(--card);
    border: 1px solid var(--ink);
    outline: 1px solid var(--ink);
    outline-offset: 5px;
    border-radius: 2px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  header {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header .rule { flex: 1; height: 1px; background: var(--ink); opacity: 0.85; }
  header h1 {
    font-size: 19px;
    font-weight: 400;
    letter-spacing: 8px;
    text-indent: 8px; /* optically re-centres letterspaced caps */
    white-space: nowrap;
  }

  .btn-corner {
    position: absolute;
    top: 14px;
    border: none;
    background: none;
    font-family: var(--serif);
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--ink-dim);
    cursor: pointer;
    padding: 6px 2px;
    border-bottom: 1px solid transparent;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .btn-corner:hover { color: var(--ink); border-bottom-color: var(--ink); }
  #openRecords { left: 18px; }
  #openSettings { right: 18px; }

  /* ---- Session tabs ---- */
  .modes { display: flex; gap: 0; border: 1px solid var(--ink); border-radius: 2px; overflow: hidden; }
  .modes button {
    border: none;
    background: transparent;
    color: var(--ink-dim);
    font-family: var(--serif);
    font-size: 10px;
    letter-spacing: 1.5px;
    padding: 9px 13px;
    white-space: nowrap;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .modes button + button { border-left: 1px solid var(--ink); }
  .modes button.active { background: var(--ink); color: var(--card); }

  /* ---- Ring ---- */
  .ring-wrap { position: relative; width: 252px; height: 252px; }
  svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .track { fill: none; stroke: var(--track); stroke-width: 5; }
  .progress {
    fill: none;
    stroke: var(--ink);
    stroke-width: 5;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.4s linear;
  }

  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .time {
    font-family: var(--numeral);
    font-size: 60px;
    font-weight: 400;
    letter-spacing: 3px;
    line-height: 1;
    font-variant-numeric: lining-nums tabular-nums;
  }
  .state-label { font-size: 11px; letter-spacing: 5px; text-indent: 5px; color: var(--ink-dim); }

  /* ---- Controls ---- */
  .controls { display: flex; align-items: center; gap: 16px; }
  .btn-main {
    border: 1px solid var(--ink);
    border-radius: 2px;
    font-family: var(--serif);
    font-size: 13px;
    letter-spacing: 4px;
    text-indent: 4px;
    color: var(--card);
    background: var(--ink);
    padding: 13px 44px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .btn-main:hover { background: var(--card); color: var(--ink); }

  .btn-side {
    width: 42px;
    height: 42px;
    border-radius: 2px;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink-dim);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s ease, background 0.2s ease;
  }
  .btn-side:hover { color: var(--card); background: var(--ink); }

  /* ---- Cycle position & stats ---- */
  .cycle { display: flex; flex-direction: column; align-items: center; gap: 9px; }
  .round-label { font-size: 11px; letter-spacing: 3px; text-indent: 3px; color: var(--ink); }
  .dots { display: flex; gap: 10px; align-items: center; }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    border: 1px solid var(--ink-faint);
    background: transparent;
    transition: all 0.25s ease;
  }
  .dot.filled { background: var(--ink); border-color: var(--ink); }
  .dot.current { border-color: var(--ink); transform: scale(1.35); }
  .today { font-size: 11px; letter-spacing: 2px; color: var(--ink-dim); }

  /* ---- Flow: free / continuous ---- */
  .flow { display: flex; align-items: center; gap: 12px; }
  .flow-label { font-size: 9px; letter-spacing: 2px; color: var(--ink-faint); }
  .flow-switch { display: flex; border: 1px solid var(--ink); border-radius: 2px; overflow: hidden; }
  .flow-switch button {
    border: none;
    background: transparent;
    color: var(--ink-dim);
    font-family: var(--serif);
    font-size: 9px;
    letter-spacing: 1.5px;
    padding: 6px 12px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .flow-switch button + button { border-left: 1px solid var(--ink); }
  .flow-switch button.active { background: var(--ink); color: var(--card); }

  .hint { font-size: 10px; letter-spacing: 2px; color: var(--ink-faint); }

  /* ---- Overlays ---- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 20, 20, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 10;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }

  .panel {
    width: min(360px, 90vw);
    max-height: 86vh;
    overflow-y: auto;
    padding: 28px 28px 24px;
    background: var(--card);
    border: 1px solid var(--ink);
    outline: 1px solid var(--ink);
    outline-offset: 4px;
    border-radius: 2px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    transform: translateY(10px);
    transition: transform 0.25s ease;
  }
  .overlay.open .panel { transform: none; }
  .panel.wide { width: min(420px, 92vw); }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 15px;
    letter-spacing: 5px;
  }
  .btn-close {
    width: 28px;
    height: 28px;
    border: 1px solid var(--ink);
    border-radius: 2px;
    background: none;
    color: var(--ink-dim);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-close:hover { background: var(--ink); color: var(--card); }

  .field label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--ink-dim);
    margin-bottom: 12px;
  }
  .field label .val {
    font-family: var(--numeral);
    font-size: 14px;
    letter-spacing: 1px;
    color: var(--ink);
    font-variant-numeric: lining-nums tabular-nums;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 2px;
    background: var(--hairline);
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: var(--ink);
    border: 3px solid var(--card);
    box-shadow: 0 0 0 1px var(--ink);
    transition: transform 0.15s ease;
  }
  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
  input[type="range"]::-moz-range-thumb {
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: var(--ink);
    border: 3px solid var(--card);
    box-shadow: 0 0 0 1px var(--ink);
  }

  .divider { height: 1px; background: var(--hairline); }

  .switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    letter-spacing: 1px;
  }
  .switch { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider-ui {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    border: 1px solid var(--ink);
    background: transparent;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .slider-ui::before {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    left: 3px;
    top: 3px;
    border-radius: 50%;
    background: var(--ink);
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .switch input:checked + .slider-ui { background: var(--ink); }
  .switch input:checked + .slider-ui::before { transform: translateX(20px); background: var(--card); }
  .switch input:disabled + .slider-ui { opacity: 0.3; cursor: not-allowed; }

  .notify-hint { font-size: 11px; color: var(--ink-dim); line-height: 1.6; margin-top: -14px; }
  .notify-hint:empty { display: none; }

  /* ---- Records panel ---- */
  .day-nav { display: flex; align-items: center; justify-content: space-between; }
  .day-nav button {
    width: 28px;
    height: 28px;
    border: 1px solid var(--ink);
    border-radius: 2px;
    background: none;
    color: var(--ink-dim);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .day-nav button:hover:not(:disabled) { background: var(--ink); color: var(--card); }
  .day-nav button:disabled { opacity: 0.25; cursor: default; }
  .day-label { font-size: 11px; letter-spacing: 2px; color: var(--ink); }
  .day-total { font-size: 11px; letter-spacing: 2px; color: var(--ink-dim); text-align: center; margin-top: -12px; min-height: 13px; }

  .records-list { display: flex; flex-direction: column; gap: 14px; max-height: 44vh; overflow-y: auto; }
  .record {
    border-bottom: 1px solid var(--hairline);
    padding-bottom: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .record-top { display: flex; align-items: baseline; gap: 10px; }
  .record-time { font-family: var(--numeral); font-size: 15px; letter-spacing: 1px; font-variant-numeric: lining-nums tabular-nums; }
  .record-dur { font-size: 10px; letter-spacing: 2px; color: var(--ink-dim); margin-left: auto; }
  .record-del {
    border: none;
    background: none;
    color: var(--ink-faint);
    cursor: pointer;
    font-size: 11px;
    padding: 2px 4px;
    transition: color 0.2s ease;
  }
  .record-del:hover { color: var(--ink); }
  .record-note {
    width: 100%;
    border: none;
    border-bottom: 1px dashed var(--hairline);
    background: transparent;
    font-family: var(--serif);
    font-style: italic;
    font-size: 13px;
    color: var(--ink);
    padding: 4px 0;
    outline: none;
    transition: border-color 0.2s ease;
  }
  .record-note:focus { border-bottom-color: var(--ink); }
  .record-note::placeholder { color: var(--ink-faint); }
  .records-empty { text-align: center; font-style: italic; color: var(--ink-dim); font-size: 13px; padding: 14px 0 4px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body data-mode="focus">

  <main class="card">
    <button class="btn-corner" id="openRecords">RECORDS</button>
    <button class="btn-corner" id="openSettings">SETTINGS</button>

    <header>
      <span class="rule"></span>
      <h1>POMODORO</h1>
      <span class="rule"></span>
    </header>

    <nav class="modes">
      <button data-mode="focus" class="active">FOCUS</button>
      <button data-mode="short">SHORT BREAK</button>
      <button data-mode="long">LONG BREAK</button>
    </nav>

    <div class="ring-wrap">
      <svg viewBox="0 0 300 300">
        <circle class="track" cx="150" cy="150" r="130"></circle>
        <circle class="progress" id="ring" cx="150" cy="150" r="130"></circle>
      </svg>
      <div class="ring-center">
        <div class="time" id="time">25:00</div>
        <div class="state-label" id="stateLabel">FOCUS</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn-side" id="reset" title="Reset" aria-label="Reset">↺</button>
      <button class="btn-main" id="start">START</button>
      <button class="btn-side" id="skip" title="Skip" aria-label="Skip">⏭</button>
    </div>

    <div class="cycle">
      <div class="round-label" id="roundLabel">ROUND 1 OF 4</div>
      <div class="dots" id="dots"></div>
      <div class="today" id="countText">TODAY · 0 DONE</div>
    </div>

    <div class="flow">
      <span class="flow-label">FLOW</span>
      <div class="flow-switch">
        <button data-flow="free" class="active" title="Start each session yourself">FREE</button>
        <button data-flow="continuous" title="Sessions chain automatically">CONTINUOUS</button>
      </div>
    </div>

    <div class="hint">SPACE — START / PAUSE</div>
  </main>

  <!-- Records -->
  <div class="overlay" id="recordsOverlay">
    <div class="panel wide" role="dialog" aria-label="Records">
      <div class="panel-head">
        <span>RECORDS</span>
        <button class="btn-close" id="closeRecords" aria-label="Close">✕</button>
      </div>
      <div class="day-nav">
        <button id="prevDay" aria-label="Previous day">‹</button>
        <span class="day-label" id="dayLabel">TODAY</span>
        <button id="nextDay" aria-label="Next day" disabled>›</button>
      </div>
      <div class="day-total" id="dayTotal"></div>
      <div class="records-list" id="recordsList"></div>
    </div>
  </div>

  <!-- Settings -->
  <div class="overlay" id="overlay">
    <div class="panel" role="dialog" aria-label="Settings">
      <div class="panel-head">
        <span>SETTINGS</span>
        <button class="btn-close" id="closeSettings" aria-label="Close">✕</button>
      </div>

      <div class="field">
        <label>Focus duration<span class="val" id="focusVal">25 min</span></label>
        <input type="range" id="focusRange" data-key="focus" min="5" max="120" step="5" value="25">
      </div>
      <div class="field">
        <label>Short break<span class="val" id="shortVal">5 min</span></label>
        <input type="range" id="shortRange" data-key="short" min="1" max="30" step="1" value="5">
      </div>
      <div class="field">
        <label>Long break<span class="val" id="longVal">15 min</span></label>
        <input type="range" id="longRange" data-key="long" min="5" max="60" step="5" value="15">
      </div>
      <div class="field">
        <label>Long break every<span class="val" id="cycleVal">4 rounds</span></label>
        <input type="range" id="cycleRange" data-key="cycle" min="2" max="8" step="1" value="4">
      </div>

      <div class="divider"></div>

      <div class="switch-row">
        <span>Chime when time is up</span>
        <label class="switch">
          <input type="checkbox" id="soundToggle" checked>
          <span class="slider-ui"></span>
        </label>
      </div>
      <div class="switch-row">
        <span>System notification</span>
        <label class="switch">
          <input type="checkbox" id="notifyToggle">
          <span class="slider-ui"></span>
        </label>
      </div>
      <div class="notify-hint" id="notifyHint"></div>
    </div>
  </div>

<script>
  const LABEL = { focus: 'FOCUS', short: 'SHORT BREAK', long: 'LONG BREAK' };
  const TITLE_LABEL = { focus: 'Focus', short: 'Short break', long: 'Long break' };
  const C = 2 * Math.PI * 130;

  /* ---- Date helpers (local time) ---- */
  function localDateStr(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function hhmm(d) {
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  /* ---- Settings (persisted) ---- */
  const DEFAULTS = { focus: 25, short: 5, long: 15, cycle: 4, sound: true, notify: false, flow: 'free' };
  let settings = { ...DEFAULTS };
  try {
    const s = JSON.parse(localStorage.getItem('pomodoro-settings') || 'null');
    if (s) settings = { ...DEFAULTS, ...s };
  } catch (e) { /* ignore corrupt data */ }

  function saveSettings() {
    try { localStorage.setItem('pomodoro-settings', JSON.stringify(settings)); } catch (e) {}
  }
  function durOf(m) { return settings[m] * 60; }

  /* ---- Records (persisted; one entry per completed focus session) ---- */
  let records = [];
  try {
    const r = JSON.parse(localStorage.getItem('pomodoro-records') || 'null');
    if (Array.isArray(r)) records = r;
  } catch (e) { /* ignore corrupt data */ }

  function saveRecords() {
    try { localStorage.setItem('pomodoro-records', JSON.stringify(records)); } catch (e) {}
  }
  function focusDoneToday() {
    const t = localDateStr(new Date());
    return records.filter(r => r.d === t).length;
  }

  /* ---- State ---- */
  let mode = 'focus';
  let sessionTotal = durOf(mode);
  let remaining = sessionTotal;
  let running = false;
  let endAt = null;
  let timerId = null;
  let autoStartId = null;

  const timeEl = document.getElementById('time');
  const ringEl = document.getElementById('ring');
  const startBtn = document.getElementById('start');
  const stateLabel = document.getElementById('stateLabel');
  const dotsEl = document.getElementById('dots');
  const countText = document.getElementById('countText');
  const roundLabel = document.getElementById('roundLabel');

  ringEl.style.strokeDasharray = C;

  function clearAutoStart() {
    if (autoStartId) { clearTimeout(autoStartId); autoStartId = null; }
  }

  /* ---- Reminders: chime + notification ---- */
  function chime(notes) {
    if (!settings.sound) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      notes.forEach((f, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'sine';
        o.frequency.value = f;
        o.connect(g);
        g.connect(ctx.destination);
        const t = ctx.currentTime + i * 0.18;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.25, t + 0.03);
        g.gain.exponentialRampToValueAtTime(0.001, t + 1.1);
        o.start(t);
        o.stop(t + 1.2);
      });
    } catch (e) { /* audio unavailable: stay silent */ }
  }

  function notifyUser(title, body) {
    if (!settings.notify || !('Notification' in window)) return;
    if (Notification.permission === 'granted') {
      try { new Notification(title, { body, requireInteraction: true }); } catch (e) { /* unsupported context */ }
    }
  }

  /* ---- Render ---- */
  function fmt(s) {
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }

  function render() {
    timeEl.textContent = fmt(remaining);
    ringEl.style.strokeDashoffset = C * (1 - remaining / sessionTotal);
    document.title = fmt(remaining) + ' · ' + TITLE_LABEL[mode] + ' — Pomodoro';
    startBtn.textContent = running ? 'PAUSE' : (remaining < sessionTotal ? 'RESUME' : 'START');
    document.body.classList.toggle('running', running);
  }

  function renderCycle() {
    const dc = focusDoneToday();
    const filledAll = dc > 0 && dc % settings.cycle === 0;
    const filled = filledAll ? settings.cycle : dc % settings.cycle;
    const inLongBreak = mode === 'long' && filledAll;

    roundLabel.textContent = inLongBreak
      ? 'CYCLE COMPLETE — LONG BREAK'
      : 'ROUND ' + (filled + 1) + ' OF ' + settings.cycle;

    dotsEl.innerHTML = '';
    for (let i = 0; i < settings.cycle; i++) {
      const d = document.createElement('div');
      d.className = 'dot';
      if (i < filled) d.classList.add('filled');
      else if (i === filled && !inLongBreak) d.classList.add('current');
      dotsEl.appendChild(d);
    }
    countText.textContent = 'TODAY · ' + dc + ' DONE';
  }

  /* ---- Timer ---- */
  function tick() {
    remaining = Math.max(0, Math.round((endAt - Date.now()) / 1000));
    if (remaining <= 0) { complete(); return; }
    render();
  }

  function start() {
    clearAutoStart();
    if (running) return;
    running = true;
    endAt = Date.now() + remaining * 1000;
    timerId = setInterval(tick, 250);
    render();
  }

  function pause() {
    clearAutoStart();
    running = false;
    clearInterval(timerId);
    render();
  }

  function resetTimer() {
    pause();
    sessionTotal = durOf(mode);
    remaining = sessionTotal;
    render();
  }

  function setMode(m) {
    mode = m;
    document.body.dataset.mode = m;
    stateLabel.textContent = LABEL[m];
    document.querySelectorAll('.modes button').forEach(b =>
      b.classList.toggle('active', b.dataset.mode === m));
    resetTimer();
    renderCycle();
  }

  function nextMode() {
    if (mode === 'focus') return focusDoneToday() % settings.cycle === 0 ? 'long' : 'short';
    return 'focus';
  }

  function complete() {
    pause();
    if (mode === 'focus') {
      const now = new Date();
      const startedAt = new Date(now.getTime() - sessionTotal * 1000);
      records.push({
        d: localDateStr(now),
        t: hhmm(startedAt),
        m: Math.max(1, Math.round(sessionTotal / 60)),
        n: ''
      });
      saveRecords();
      if (recordsOverlay.classList.contains('open')) renderRecords();
      chime([523.25, 659.25, 783.99]);
      notifyUser('Focus complete', 'Well done — take a break.');
    } else {
      chime([783.99, 659.25, 523.25]);
      notifyUser('Break over', 'Time for the next focus session.');
    }
    setMode(nextMode());
    if (settings.flow === 'continuous') {
      autoStartId = setTimeout(() => { autoStartId = null; start(); }, 1200);
    } else {
      document.title = "Time's up — Pomodoro";
    }
  }

  /* ---- Main events ---- */
  startBtn.addEventListener('click', () => (running ? pause() : start()));
  document.getElementById('reset').addEventListener('click', resetTimer);
  document.getElementById('skip').addEventListener('click', () => setMode(nextMode()));
  document.querySelectorAll('.modes button').forEach(b =>
    b.addEventListener('click', () => setMode(b.dataset.mode)));

  document.querySelectorAll('.flow-switch button').forEach(b => {
    b.classList.toggle('active', b.dataset.flow === settings.flow);
    b.addEventListener('click', () => {
      settings.flow = b.dataset.flow;
      saveSettings();
      document.querySelectorAll('.flow-switch button').forEach(x =>
        x.classList.toggle('active', x === b));
    });
  });

  /* ---- Overlays ---- */
  const overlay = document.getElementById('overlay');
  const recordsOverlay = document.getElementById('recordsOverlay');
  function anyOverlayOpen() {
    return overlay.classList.contains('open') || recordsOverlay.classList.contains('open');
  }

  document.getElementById('openSettings').addEventListener('click', () => overlay.classList.add('open'));
  document.getElementById('closeSettings').addEventListener('click', () => overlay.classList.remove('open'));
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });

  document.getElementById('openRecords').addEventListener('click', () => {
    viewDate = new Date();
    renderRecords();
    recordsOverlay.classList.add('open');
  });
  document.getElementById('closeRecords').addEventListener('click', () => recordsOverlay.classList.remove('open'));
  recordsOverlay.addEventListener('click', e => { if (e.target === recordsOverlay) recordsOverlay.classList.remove('open'); });

  /* ---- Records panel ---- */
  const MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  const DAYS = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
  let viewDate = new Date();

  const dayLabelEl = document.getElementById('dayLabel');
  const dayTotalEl = document.getElementById('dayTotal');
  const recordsListEl = document.getElementById('recordsList');
  const prevDayBtn = document.getElementById('prevDay');
  const nextDayBtn = document.getElementById('nextDay');

  function fmtTotal(mins) {
    if (mins < 60) return mins + ' MIN';
    const h = Math.floor(mins / 60);
    const r = mins % 60;
    return r ? h + ' H ' + r + ' MIN' : h + ' H';
  }

  function endTime(t, m) {
    const parts = t.split(':');
    const d = new Date();
    d.setHours(+parts[0], +parts[1] + m, 0, 0);
    return hhmm(d);
  }

  function renderRecords() {
    const key = localDateStr(viewDate);
    const dateStr = DAYS[viewDate.getDay()] + ' ' + viewDate.getDate() + ' ' +
      MONTHS[viewDate.getMonth()] + ' ' + viewDate.getFullYear();
    dayLabelEl.textContent = key === localDateStr(new Date()) ? 'TODAY · ' + dateStr : dateStr;
    nextDayBtn.disabled = key === localDateStr(new Date());

    const recs = records.filter(r => r.d === key).slice().reverse();
    const total = recs.reduce((a, r) => a + r.m, 0);
    dayTotalEl.textContent = recs.length ? 'TOTAL — ' + fmtTotal(total) : '';

    recordsListEl.innerHTML = '';
    if (!recs.length) {
      const empty = document.createElement('div');
      empty.className = 'records-empty';
      empty.textContent = 'No focus sessions recorded.';
      recordsListEl.appendChild(empty);
      return;
    }

    recs.forEach(r => {
      const row = document.createElement('div');
      row.className = 'record';

      const top = document.createElement('div');
      top.className = 'record-top';

      const time = document.createElement('span');
      time.className = 'record-time';
      time.textContent = r.t + ' – ' + endTime(r.t, r.m);

      const dur = document.createElement('span');
      dur.className = 'record-dur';
      dur.textContent = r.m + ' MIN';

      const del = document.createElement('button');
      del.className = 'record-del';
      del.textContent = '✕';
      del.setAttribute('aria-label', 'Delete record');
      del.addEventListener('click', () => {
        records = records.filter(x => x !== r);
        saveRecords();
        renderRecords();
        renderCycle();
      });

      top.appendChild(time);
      top.appendChild(dur);
      top.appendChild(del);

      const note = document.createElement('input');
      note.className = 'record-note';
      note.placeholder = 'What did you work on?';
      note.value = r.n || '';
      note.addEventListener('input', () => { r.n = note.value; saveRecords(); });

      row.appendChild(top);
      row.appendChild(note);
      recordsListEl.appendChild(row);
    });
  }

  prevDayBtn.addEventListener('click', () => {
    viewDate.setDate(viewDate.getDate() - 1);
    renderRecords();
  });
  nextDayBtn.addEventListener('click', () => {
    viewDate.setDate(viewDate.getDate() + 1);
    renderRecords();
  });

  /* ---- Settings panel ---- */
  const notifyToggle = document.getElementById('notifyToggle');
  const notifyHint = document.getElementById('notifyHint');

  function paintRange(input) {
    const pct = (input.value - input.min) / (input.max - input.min) * 100;
    input.style.background =
      'linear-gradient(90deg, #141414 0%, #141414 ' + pct + '%, rgba(20,20,20,0.16) ' + pct + '%)';
  }

  const rangeFields = {
    focus: { input: document.getElementById('focusRange'), badge: document.getElementById('focusVal'), unit: ' min' },
    short: { input: document.getElementById('shortRange'), badge: document.getElementById('shortVal'), unit: ' min' },
    long:  { input: document.getElementById('longRange'),  badge: document.getElementById('longVal'),  unit: ' min' },
    cycle: { input: document.getElementById('cycleRange'), badge: document.getElementById('cycleVal'), unit: ' rounds' },
  };

  Object.entries(rangeFields).forEach(([key, f]) => {
    f.input.value = settings[key];
    f.badge.textContent = settings[key] + f.unit;
    paintRange(f.input);
    f.input.addEventListener('input', () => {
      settings[key] = +f.input.value;
      f.badge.textContent = f.input.value + f.unit;
      paintRange(f.input);
      saveSettings();
      if (key === 'cycle') renderCycle();
      // Changing the current mode's duration while idle applies at once; mid-run it applies next session
      if (key === mode && !running) resetTimer();
    });
  });

  const soundToggle = document.getElementById('soundToggle');
  soundToggle.checked = settings.sound;
  soundToggle.addEventListener('change', () => {
    settings.sound = soundToggle.checked;
    saveSettings();
  });

  function refreshNotifyUI() {
    if (!('Notification' in window)) {
      notifyToggle.disabled = true;
      notifyHint.textContent = 'This browser does not support notifications; the chime will be used instead.';
      return;
    }
    if (Notification.permission === 'denied') {
      notifyToggle.checked = false;
      notifyHint.textContent = 'Notifications are blocked by the browser. If clicking this switch does nothing, check Chrome ▸ Settings ▸ Privacy and security ▸ Site settings ▸ Notifications and choose "Sites can ask to send notifications", then reload this page.';
    } else {
      notifyHint.textContent = '';
    }
    notifyToggle.checked = settings.notify && Notification.permission === 'granted';
  }

  notifyToggle.addEventListener('change', () => {
    if (!('Notification' in window)) return;
    if (notifyToggle.checked && Notification.permission === 'default') {
      Notification.requestPermission().then(p => {
        settings.notify = notifyToggle.checked && p === 'granted';
        if (p !== 'granted') notifyToggle.checked = false;
        saveSettings();
        refreshNotifyUI();
      });
    } else {
      settings.notify = notifyToggle.checked && Notification.permission === 'granted';
      saveSettings();
      refreshNotifyUI();
    }
  });

  refreshNotifyUI();

  /* ---- Keyboard ---- */
  document.addEventListener('keydown', e => {
    if (e.code === 'Escape' && anyOverlayOpen()) {
      overlay.classList.remove('open');
      recordsOverlay.classList.remove('open');
      return;
    }
    if (anyOverlayOpen()) return;
    if (e.code === 'Space' && e.target === document.body) {
      e.preventDefault();
      running ? pause() : start();
    }
  });

  render();
  renderCycle();

  /* ---- External control API (used by the terminal bridge command) ---- */
  window.pomodoro = {
    toggle: () => (running ? pause() : start()),
    skip: () => setMode(nextMode()),
    reset: () => resetTimer(),
    state: () => ({ mode, remaining, running, doneToday: focusDoneToday() }),
    status: () => LABEL[mode] + ' ' + fmt(remaining) + (running ? ' · RUNNING' : ' · PAUSED') + ' · TODAY ' + focusDoneToday()
  };
</script>
</body>
</html>
